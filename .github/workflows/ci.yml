name: CI

# Every pull request gets the formula audited, built from source at its pinned
# revision, and tested. The ruleset on main requires this job, which is what
# lets bump-tap.yml's PRs auto-merge safely.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      FORMULA: k3KAW8Pnf7mkmdSMPHz27/mcp/eventkit-mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: homebrew-mcp

      - name: Select Xcode 26 / Swift 6.2+
        run: sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer

      - name: Put this checkout where Homebrew expects the tap
        run: |
          set -euo pipefail
          TAPS="$(brew --repository)/Library/Taps/k3kaw8pnf7mkmdsmphz27"
          mkdir -p "$TAPS"
          cp -R "$GITHUB_WORKSPACE/homebrew-mcp" "$TAPS/homebrew-mcp"
          brew tap-info k3KAW8Pnf7mkmdSMPHz27/mcp

      - name: Audit
        run: brew audit --strict "$FORMULA"

      - name: Build from source at the pinned revision
        run: brew install --build-from-source "$FORMULA"

      - name: Test
        run: brew test "$FORMULA"
